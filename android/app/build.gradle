plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pari.ielts85'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pari.ielts85'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs directly (fine for personal use).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
